services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "5432:5432"
    volumes:
      - studio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: studio/backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://studio:studio@postgres:5432/studio
      REDIS_URL: redis://redis:6379/0
      STUDIO_RUN_INLINE: "0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: studio/backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://studio:studio@postgres:5432/studio
      REDIS_URL: redis://redis:6379/0
      STUDIO_RUN_INLINE: "0"
    command: ["arq", "wbr_studio.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  studio_pg:
