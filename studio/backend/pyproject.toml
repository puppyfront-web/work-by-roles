[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wbr-studio"
version = "0.1.0"
description = "Product shell for work-by-roles: workspaces, encrypted provider keys, teams, and audited runs"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pyjwt>=2.9",
  "cryptography>=43",
  "arq>=0.26",
  "redis>=5.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["wbr_studio*"]
